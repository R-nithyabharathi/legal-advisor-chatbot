<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <style>
        /* Reset & Body */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        /* Floating Card */
        .container {
            background: #1a1a1a;
            padding: 50px 40px;
            width: 360px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(20, 149, 255, 0.4), 0 0 20px rgba(255, 20, 147, 0.3);
            animation: floatBox 4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes floatBox {
            0% {transform: translateY(0);}
            50% {transform: translateY(-10px);}
            100% {transform: translateY(0);}
        }

        /* Decorative Circles */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }
        .container::before {
            width: 200px;
            height: 200px;
            background: rgba(20, 149, 255, 0.2);
            top: -60px;
            right: -60px;
        }
        .container::after {
            width: 150px;
            height: 150px;
            background: rgba(255, 20, 147, 0.15);
            bottom: -50px;
            left: -50px;
        }

        /* Heading */
        h2 {
            text-align: center;
            color: #ffb6c1;
            margin-bottom: 35px;
            z-index: 1;
            position: relative;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            z-index: 1;
            position: relative;
            transition: 0.3s;
        }

        input::placeholder {
            color: #aaa;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px #1495ff;
            background: #1f1f1f;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #1495ff, #ff3aa7);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
            z-index: 1;
            position: relative;
        }

        button:hover {
            background: linear-gradient(135deg, #ff3aa7, #1495ff);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 58, 167, 0.5);
        }

        /* Link */
        .link {
            text-align: center;
            margin-top: 18px;
            color: #fff;
            font-size: 14px;
            z-index: 1;
            position: relative;
        }

        .link a {
            color: #ffb6c1;
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Create Account</h2>

    <form th:action="@{/register}" method="post">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Register</button>

    </form>

    <div class="link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
