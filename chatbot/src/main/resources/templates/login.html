<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        /* Reset & Body */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container */
        .container {
            background: #1a1a1a;
            padding: 50px 40px;
            width: 360px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(20, 149, 255, 0.4), 0 0 20px rgba(255, 20, 147, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Decorative Circles */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }
        .container::before {
            width: 200px;
            height: 200px;
            background: rgba(20, 149, 255, 0.2);
            top: -60px;
            right: -60px;
        }
        .container::after {
            width: 150px;
            height: 150px;
            background: rgba(255, 20, 147, 0.15);
            bottom: -50px;
            left: -50px;
        }

        /* Heading */
        h2 {
            text-align: center;
            color: #ffb6c1;
            margin-bottom: 35px;
            z-index: 1;
            position: relative;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            z-index: 1;
            position: relative;
        }

        input::placeholder {
            color: #aaa;
        }

        input:focus {
            outline: none;
            background: #1f1f1f;
            box-shadow: 0 0 5px #1495ff;
        }

        /* Button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #1495ff, #ff3aa7);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
            z-index: 1;
            position: relative;
        }

        button:hover {
            background: linear-gradient(135deg, #ff3aa7, #1495ff);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 58, 167, 0.5);
        }

        /* Links */
        .link {
            text-align: center;
            margin-top: 18px;
            color: #fff;
            font-size: 14px;
            z-index: 1;
            position: relative;
        }

        .link a {
            color: #ffb6c1;
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* Error Message */
        .error {
            color: #ff4c4c;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            z-index: 1;
            position: relative;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <div class="link">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

    <div class="error" th:if="${param.error}">
        Invalid username or password
    </div>
</div>

</body>
</html>
