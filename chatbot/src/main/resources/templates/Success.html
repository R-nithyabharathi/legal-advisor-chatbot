<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Success</title>

    <style>
        /* Body & Background */
        body {
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
            position: relative;
        }

        /* Overlay for dark theme */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.75);
            z-index: 0;
        }

        /* Container */
        .success-container {
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #1a1a1a, #222);
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(20, 149, 255, 0.4), 0 0 20px rgba(255, 58, 167, 0.3);
            max-width: 450px;
            width: 90%;
            animation: floatBox 4s ease-in-out infinite;
        }

        @keyframes floatBox {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        /* Heading */
        .success-container h2 {
            color: #ffb6c1;
            font-size: 2.2em;
            margin-bottom: 20px;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #ff3aa7, 0 0 10px #1495ff; }
            100% { text-shadow: 0 0 15px #ff3aa7, 0 0 20px #1495ff; }
        }

        /* Paragraph */
        .success-container p {
            color: #ddd;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        /* Button */
        .success-container button {
            background: linear-gradient(135deg, #1495ff, #ff3aa7);
            color: #fff;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: 0.3s;
        }

        .success-container button:hover {
            background: linear-gradient(135deg, #ff3aa7, #1495ff);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 58, 167, 0.5);
        }

        /* Responsive */
        @media(max-width: 500px) {
            .success-container h2 { font-size: 1.8em; }
            .success-container p { font-size: 1em; }
            .success-container button { width: 100%; }
        }

    </style>
</head>
<body>
<div class="success-container">
    <h2>Success!</h2>
    <p>Your appointment has been booked successfully, We will contact you Soon</p>
</div>

</body>
</html>
